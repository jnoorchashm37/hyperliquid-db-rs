[package]
name = "hyperliquid-db"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
notify = { version = "8.2.0", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
strum = { version = "0.28", features = ["derive"] }
itertools = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11.1"

[dev-dependencies]
tempfile = "3"
tungstenite = { version = "0.29", features = ["native-tls"] }

[[bench]]
name = "fs_watching"
path = "bench/fs_watching.rs"
harness = false

[[bench]]
name = "ws_speed"
path = "bench/ws_speed.rs"
harness = false


[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 15


[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
