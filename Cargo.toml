[workspace]
members = ["hyperliquid-db-core", "hyperliquid-db-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "BUSL-1.1"
exclude = [".github/"]


[workspace.dependencies]

hyperliquid-db-core = { path = "./hyperliquid-db-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
notify = { version = "8.2.0", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
strum = { version = "0.28", features = ["derive"] }
itertools = "0.14"
tempfile = "3"
tungstenite = { version = "0.29", features = ["native-tls"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }

# [target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11.1"


[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 15


[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
