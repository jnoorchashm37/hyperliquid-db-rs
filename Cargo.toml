[package]
name = "hyperliquid-db"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
rmpv = "1"
thiserror = "2"
notify = { version = "8.2.0", features = ["serde"] }
inotify = "0.11.1"

[dev-dependencies]
rmp-serde = "1"
tempfile = "3"
